<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout Summary Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <header class="card__header">
      <h1 class="card__title">Great Job!</h1>
      <p class="card__subtitle">You completed today's workout.</p>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="stat__label">Score</div>
        <div class="stat__value">92</div>
      </div>
      <div class="stat">
        <div class="stat__label">Distance</div>
        <div class="stat__value">5.2 km</div>
      </div>
      <div class="stat">
        <div class="stat__label">Calories</div>
        <div class="stat__value">320</div>
      </div>
    </div>

    <button class="button" type="button">View Full Summary</button>
  </div>

</body>
</html>
